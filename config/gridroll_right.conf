CONFIG_ZMK_STUDIO=y
# Runtime processor rotation uses the complete C math library.
CONFIG_NEWLIB_LIBC=y
CONFIG_STATIC_INIT_GNU=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
